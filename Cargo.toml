[package]
name = "chair_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bevy_fps_controller = { version = "20", features = ["rapier"] }
bevy_rapier3d = "0.37"

[features]
# scripted test runs that save screenshots (src/betty.rs); off in normal builds
betty = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3